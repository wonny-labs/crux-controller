for option in CONFIG_CRUX_CONTROLLER_NET=y CONFIG_CRUX_SOCKETS=y CONFIG_CRUX_NETIF=y \
    'CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.77.2"' CONFIG_NET_CONFIG_SETTINGS=y; do
  grep -qxF "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
done
grep -Eq 'local-mac-address = \[ *02 *43 *52 *55 *58 *20 *\]' "$build/zephyr.dts" || {
  echo "the net overlay did not set the MAC address" >&2
  grep -n 'mac' "$build/zephyr.dts" | head -20 >&2 || true
  grep -rn 'net.overlay' crux-controller/build/net/CMakeCache.txt | head -5 >&2 || true
  exit 1
}
! grep -q 'green_led' "$build/zephyr.dts" || {
  echo "the net overlay did not delete green_led" >&2
  exit 1
}
'''
tiers = ["nightly"]

# --- product-integration -------------------------------------------------------------------------
# A product imports the framework as a project of its own west workspace (west's T2 topology), at
# the commit under test, with Crux at the pin of this repository through the import. The script
# tests/product_integration/run.sh does each step and refuses a folder that it did not make. It
# flashes nothing and operates no board. Locally, from the clone on a Linux host:
#   scripts/ci/run-tier.sh nightly --job product-integration

[[check]]
id = "product-integration-workspace"
job = "product-integration"
run = '''
tests/product_integration/run.sh workspace "${RUNNER_TEMP:-/tmp}/product-integration"
'''
tiers = ["nightly"]

[[check]]
id = "product-integration-build"
job = "product-integration"
run = '''
tests/product_integration/run.sh build "${RUNNER_TEMP:-/tmp}/product-integration"
'''
tiers = ["nightly"]

[[check]]
id = "product-integration-run"
job = "product-integration"
run = '''
tests/product_integration/run.sh run "${RUNNER_TEMP:-/tmp}/product-integration"
'''
tiers = ["nightly"]

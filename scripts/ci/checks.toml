[[check]]
id = "sntp-config"
job = "sntp"
run = '''
cd ..
build=crux-controller/build/sntp/zephyr
# An unmet Kconfig dependency only warns, so the image could be built without the SNTP
# library or without the network that it needs. Check what the build resolved, not what
# the command line asked for, including the defaults of the settings.
for option in CONFIG_CRUX_CONTROLLER_SNTP=y CONFIG_CRUX_CONTROLLER_NET=y \
    CONFIG_CRUX_CONTROLLER_WORKLOAD=y CONFIG_SNTP=y CONFIG_CRUX_TIME=y CONFIG_NET_UDP=y \
    CONFIG_NET_IPV4=y 'CONFIG_CRUX_CONTROLLER_TIME_SERVER="192.168.77.1"' \
    CONFIG_CRUX_CONTROLLER_TIME_INTERVAL_S=600 CONFIG_CRUX_CONTROLLER_TIME_TIMEOUT_MS=3000 \
    CONFIG_CRUX_CONTROLLER_TIME_STALE_AGE_S=1800 CONFIG_CRUX_CONTROLLER_TIME_THRESHOLD_MS=100 \
    CONFIG_CRUX_CONTROLLER_TIME_MAX_STEP_MS=1000 CONFIG_CRUX_CONTROLLER_TIME_STACK=8192; do
  grep -qxF "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
done
# Nothing else may own the clock or the time source: no RTC adapter of Crux Time, no
# uncertainty option of the SNTP library (it changes the time that the library reports),
# none of the network configuration library's own SNTP clock setters (a second writer of
# the clock), no other capability, and no Crux Thread or Sync provider.
for option in CONFIG_CRUX_TIME_RTC=y CONFIG_SNTP_UNCERTAINTY=y CONFIG_CRUX_CONTROLLER_FILE=y \
    CONFIG_CRUX_CONTROLLER_SYSTEM=y CONFIG_CRUX_CONTROLLER_M3=y CONFIG_CRUX_THREAD=y \
    CONFIG_CRUX_SYNC=y CONFIG_NET_CONFIG_CLOCK_SNTP_INIT=y \
    CONFIG_NET_CONFIG_SNTP_INIT_RESYNC=y; do
  ! grep -qxF "$option" "$build/.config" || { echo "unexpected $option" >&2; exit 1; }
done
'''
scope = "always"

[[check]]
id = "sntp-symbols"
job = "sntp"
run = '''
cd ..
nm=$(find "$ZEPHYR_SDK_INSTALL_DIR" -name 'arm-zephyr-eabi-nm' -type f | head -n 1)

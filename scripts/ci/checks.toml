"$nm" crux-controller/build/sntp/zephyr/zephyr.elf > symbols.txt
# The policy, the glue, the adapter and the calls that the glue makes are linked. The
# absence of other callers of the clock is checked in the sources by the tooling tests:
# the Crux Time library and the SNTP library define the other authority and query calls
# themselves, so their symbols are not a sign of a caller.
for symbol in time_sync_init time_sync_poll time_sync_start time_sync_decide \
    time_sync_port_query time_sync_port_start sntp_simple crux_realtime_init \
    crux_realtime_set crux_realtime_set_synchronized crux_realtime_get_snapshot; do
  grep -qE " [Tt] ${symbol}$" symbols.txt || { echo "not linked: $symbol" >&2; exit 1; }
done
'''
scope = "always"


# The CI checks of this repository and the rules that pick them for each tier.
# scripts/ci/run-tier.sh reads this file; CONTRIBUTING.md (section "CI tiers") describes the tiers,
# and the format is that of the Crux map file (the Crux page linked from there).
#
# Every check runs with `bash -eo pipefail -c <run>` from the repository root, which is the folder
# crux-controller in the west workspace folder. A check that needs the workspace starts with
# `cd ..`. Within a job the checks run in the order written here, and the first failing check stops
# the job. scripts/ci/prepare-job.sh sets up the workspace of a job before its first check.
# tests/tooling/test_ci_tiers.py holds the list of check ids: removing a check fails that test.

version = 1

[selection]
# A change whose every file matches these is documentation only.
docs = ["docs/**", "**.md"]
# A fast run falls back to the full tier when a changed file matches one of these: CI and build
# files, scripts, the manifest, every CMake, Kconfig, .conf and .overlay file, the budgets and the
# style configuration. A changed file outside every component and the documentation falls back too.
escalate = [
  ".github/**",
  "Jenkinsfile",
  "scripts/**",
  "west.yml",
  "**/CMakeLists.txt",
  "**/*.cmake",
  "**/Kconfig*",
  "**/*.conf",
  "**/*.overlay",
  "budgets/**",
  ".clang-format",
  ".clang-tidy",
]
# A fast run falls back to the full tier when the change touches more components than this.
max_components = 3

# Each component lists the paths that belong to it.
[components]
product = ["app/src/**", "app/compose/**", "app/os/**", "workload/**", "framework/src/**",
           "framework/compose/**", "framework/os/**", "include/**"]
management = ["framework/management/**", "tests/native_sim_mbed/**"]
framework = ["zephyr/**", "tests/framework/**"]
host-tests = ["tests/host/**"]
scenarios = ["tests/native_sim/**"]
tooling = ["tests/tooling/**"]
release = ["release/**"]

# Scopes name the changes that a check needs in the full tier:
#   code    (the default) every change except one that is documentation only
#   always  every change, documentation only included
#   a name  the path patterns below; each list is the path filter of the workflow that runs the
#           job, plus this folder, which holds the checks
# With no known change (a manual or nightly run) every check runs.
[scopes]
devcontainer = [
  ".devcontainer/**",
  "scripts/dev-shell.sh",
  "scripts/bootstrap.sh",
  ".vscode/**",
  "west.yml",
  ".github/workflows/devcontainer.yml",
  "scripts/ci/**",
]
rebuild = [".github/workflows/rebuild.yml", "release/**", "scripts/ci/**"]
release = [".github/workflows/release.yml", "release/**", "west.yml", "scripts/ci/**"]

# One job per runner of each CI system. A job's env gives defaults that its checks see; the CI
# system's own environment wins.
[jobs.tooling]
description = "Tooling tests and SPDX headers"
[jobs.pins]
description = "West pins: the contract check, the Mbed-only checks and two negative controls"
[jobs.host-OFF]
description = "Host tests, sanitizers off"
[jobs.host-ON]
description = "Host tests, sanitizers on"
[jobs.workload]
description = "workload: Twister on native_sim, then the RT1060-EVKB build"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.net]
description = "net build (RT1060-EVKB, networking)"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.file]
description = "file build (RT1060-EVKB, File)"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.system]
description = "system build (RT1060-EVKB, System)"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.sntp]
description = "sntp build (RT1060-EVKB, SNTP time synchronisation)"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.management]
description = "management build (HTTPS management, native_sim and RT1060-EVKB)"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.boundary]
description = "Boundary check and the Crux product include checks"
[jobs.patch-style]
description = "Patch style: Zephyr's checkpatch, rule BRACES, on the changed C lines"
[jobs.minimal]
description = "minimal build (RT1060-EVKB)"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.base]
description = "base build (base image, native_sim and RT1060-EVKB)"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.static]
description = "Static analysis: clang-format and clang-tidy"

# The Budget jobs build each configuration and check its static resource use against
# budgets/limits.json with scripts/ci/budget.sh, which reads CONFIG, CONF, OVERLAY and REQUIRE.
[jobs.budget-minimal]
description = "Budget minimal"
env = { BOARD = "mimxrt1060_evk@B//qspi", CONFIG = "minimal", CONF = "", OVERLAY = "", REQUIRE = "" }
[jobs.budget-workload]
description = "Budget workload"
env = { BOARD = "mimxrt1060_evk@B//qspi", CONFIG = "workload", CONF = "conf/workload.conf", OVERLAY = "", REQUIRE = "" }
[jobs.budget-net]
description = "Budget net"
env = { BOARD = "mimxrt1060_evk@B//qspi", CONFIG = "net", CONF = "conf/workload.conf;conf/net.conf", OVERLAY = "boards/net.overlay", REQUIRE = "" }
# file is built on workload, without the network that net configures. Its fragment and overlay would
# build silently without File if a Kconfig dependency were unmet, so the build is checked.
[jobs.budget-file]
description = "Budget file"
env = { BOARD = "mimxrt1060_evk@B//qspi", CONFIG = "file", CONF = "conf/workload.conf;conf/file.conf", OVERLAY = "boards/file.overlay", REQUIRE = "CONFIG_CRUX_CONTROLLER_FILE=y CONFIG_CRUX_FILE_FATFS_RT1060=y" }
# system is built on workload, without the network that net configures or the File storage of file.
# Its fragment would build silently without System if a Kconfig dependency were unmet, so the build
# is checked.
[jobs.budget-system]
description = "Budget system"
env = { BOARD = "mimxrt1060_evk@B//qspi", CONFIG = "system", CONF = "conf/workload.conf;conf/system.conf", OVERLAY = "boards/system.overlay", REQUIRE = "CONFIG_CRUX_CONTROLLER_SYSTEM=y CONFIG_CRUX_SYSTEM=y" }
# sntp is built on the network that net configures, with the SNTP library. Its fragment would build
# silently without SNTP if a Kconfig dependency were unmet, so the build is checked.
[jobs.budget-sntp]
description = "Budget sntp"
env = { BOARD = "mimxrt1060_evk@B//qspi", CONFIG = "sntp", CONF = "conf/workload.conf;conf/net.conf;conf/sntp.conf", OVERLAY = "boards/net.overlay", REQUIRE = "CONFIG_CRUX_CONTROLLER_SNTP=y CONFIG_CRUX_CONTROLLER_NET=y CONFIG_SNTP=y" }
# management is built on the network that net configures, with the Mbed TLS profile of Crux Access,
# the web server and the RAM disk. Its fragment would build silently without management if a Kconfig
# dependency were unmet, so the build is checked. It is the only Budget job that needs the Mbed TLS
# group, which its first check switches on in its own workspace.
[jobs.budget-management]
description = "Budget management"
env = { BOARD = "mimxrt1060_evk@B//qspi", CONFIG = "management", CONF = "conf/workload.conf;conf/net.conf;conf/management.conf", OVERLAY = "boards/net.overlay;boards/management.overlay", REQUIRE = "CONFIG_CRUX_CONTROLLER_MANAGEMENT=y CONFIG_CRUX_ACCESS=y CONFIG_CRUX_PSA_THREADING=y CONFIG_CRUX_WEB_MANAGEMENT=y" }

# The base image is the controller framework with no application, on the network, the Mbed TLS
# profile and the RAM disk of management. Its fragment would build silently without the framework
# or one of its services if a Kconfig dependency were unmet, so the build is checked. It needs the
# Mbed TLS group, which its first check switches on in its own workspace.
[jobs.budget-base]
description = "Budget base"
env = { BOARD = "mimxrt1060_evk@B//qspi", CONFIG = "base", CONF = "conf/base.conf", OVERLAY = "boards/net.overlay;boards/management.overlay", REQUIRE = "CONFIG_CRUX_CONTROLLER_FRAMEWORK=y CONFIG_CRUX_CONTROLLER_FRAMEWORK_MANAGEMENT=y CONFIG_CRUX_CONTROLLER_FRAMEWORK_TIME_SYNC=y CONFIG_CRUX_CONTROLLER_FRAMEWORK_CLI_SERIAL=y CONFIG_CRUX_ACCESS=y CONFIG_CRUX_WEB_MANAGEMENT=y CONFIG_CRUX_CLI_CONSOLE=y" }

# The Dev container job builds the image of .devcontainer/ and runs checks in it through
# scripts/dev-shell.sh. The SEGGER download accepts SEGGER's terms of use, and no check uses a
# probe, so CI builds the image without the J-Link software (dev-shell.sh passes CRUX_JLINK by
# name). CHECK_SHA256 is the hash of the product include check of the Boundary job.
[jobs.devcontainer]
description = "Dev container: tooling tests, boundary checks, workload native_sim and RT1060-EVKB"
env = { CRUX_JLINK = "0", CHECK_SHA256 = "1e19b0aa3e300cfe7a542a06fe348343ad0963883ca822d7d1355be1af6b1e37" }
[jobs.rebuild]
description = "Rebuild net at another path and compare"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
[jobs.release]
description = "Release dry run (publishes nothing)"
env = { BOARD = "mimxrt1060_evk@B//qspi", PRODUCT_VERSION = "0.1.0+1", SECURITY_COUNTER = "0", RELEASE_TAG = "v0.1.0" }
# Information only: the net build against the current main of crux-pilot. It rewrites the crux-pilot
# revision in the working copy of west.yml, commits nothing and publishes nothing.
[jobs.scheduled-main]
description = "net build against crux-pilot main"
env = { BOARD = "mimxrt1060_evk@B//qspi" }
# The product integration check: the fixture product of tests/product_integration imports this
# repository at the commit under test into a west workspace of its own, builds on native_sim and
# runs. Its checks make that workspace in the runner's temporary folder.
[jobs.product-integration]
description = "Product integration: a fixture product imports the framework, native_sim"

# --- tooling -------------------------------------------------------------------------------------

[[check]]
id = "tooling-tests"
job = "tooling"
run = '''
python -m unittest discover -s tests/tooling -v
'''
scope = "always"
fast = "always"

# Every covered first-party file starts with the licence identifier line. The list of the
# files that predate the check is in the script and can only get shorter.
[[check]]
id = "spdx"
job = "tooling"
run = '''
python scripts/check_spdx.py
'''
scope = "always"
fast = "always"

# --- pins ----------------------------------------------------------------------------------------
# scripts/ci/prepare-job.sh fetches the workspace: the manifest repository sits in a workspace
# directory, one level below the west workspace root, as in the product template.

[[check]]
id = "pins-contract"
job = "pins"
run = '''
cd ..
set -o pipefail
west crux-pins | tee pins.txt
grep -q '^CONTRACT crux-pilot ' pins.txt
if grep -q '^MISMATCH' pins.txt; then
  echo "unexpected MISMATCH" >&2
  exit 1
fi
'''
scope = "always"

# The Crux import is narrowed by name, so switching the Mbed TLS group on would activate the
# Mbed modules and not the GPL stacks that share their group. The three checks below read the
# resolved project list (west list does not clone anything) and run before the control that
# edits west.yml. This job fetches nothing with the group on. The management job does, after the same
# check.
[[check]]
id = "pins-mbed-default"
job = "pins"
run = '''
cd ..
west list --all -f '{name} {active}' > list-default.txt
cat list-default.txt
python crux-controller/scripts/check_mbed_only.py --mode default < list-default.txt
'''
scope = "always"

[[check]]
id = "pins-mbed-group-on"
job = "pins"
run = '''
cd ..
# The group is switched on in this runner only, and again off at the end.
west config --local manifest.group-filter -- +crux-secure-management
west list --all -f '{name} {active}' > list-mbed.txt
cat list-mbed.txt
python crux-controller/scripts/check_mbed_only.py --mode mbed --baseline list-default.txt < list-mbed.txt
west config --local -d manifest.group-filter
'''
scope = "always"

[[check]]
id = "pins-negative-unnarrowed-import"
job = "pins"
run = '''
cd ..
# The same manifest without the blocklist, with the group on: the wolf projects are
# then in the resolved manifest and the check must find them. The edit and the group
# setting stay in the runner and are undone at the end.
python - <<'PY'
import yaml

path = "crux-controller/west.yml"
data = yaml.safe_load(open(path))
for project in data["manifest"]["projects"]:
    if project["name"] == "crux-pilot":
        project["import"] = True
yaml.safe_dump(data, open(path, "w"), sort_keys=False)
PY
west config --local manifest.group-filter -- +crux-secure-management
west list --all -f '{name} {active}' > list-negative.txt
set +e
python crux-controller/scripts/check_mbed_only.py --mode mbed < list-negative.txt > check-negative.txt 2>&1
status=$?
set -e
cat check-negative.txt
west config --local -d manifest.group-filter
git -C crux-controller checkout -- west.yml
test "$status" -eq 1
grep -q 'wolfssl' check-negative.txt
'''
scope = "always"

[[check]]
id = "pins-negative-pin-without-reason"
job = "pins"
run = '''
cd ..
# An older revision of littlefs than the one Crux pins (the parent of
# that commit, so no newer commit is needed), with no crux-override.
# The full west update of this job has already fetched the pinned
# commit, so west crux-pins resolves both and reports MISMATCH rather
# than an error. This edit stays in the runner's working copy.
python - <<'PY'
import yaml

path = "crux-controller/west.yml"
data = yaml.safe_load(open(path))
manifest = data["manifest"]
if not any(remote["name"] == "zephyrproject-rtos" for remote in manifest["remotes"]):
    manifest["remotes"].append(
        {"name": "zephyrproject-rtos", "url-base": "https://github.com/zephyrproject-rtos"}
    )
manifest["projects"].append(
    {
        "name": "littlefs",
        "remote": "zephyrproject-rtos",
        "revision": "11c9d5f01d392c5bbb2a3ca1496625acca28cc74",
        "path": "modules/fs/littlefs",
    }
)
yaml.safe_dump(data, open(path, "w"), sort_keys=False)
PY
west update littlefs
set +e
west crux-pins > pins-negative.txt 2>&1
status=$?
set -e
cat pins-negative.txt
test "$status" -ne 0
grep -q '^MISMATCH littlefs .* (contract ' pins-negative.txt
'''
scope = "always"

# --- host-OFF ------------------------------------------------------------------------------------

[[check]]
id = "host-tests-sanitize-off"
job = "host-OFF"
run = '''
cmake -S tests/host -B build/host -G Ninja -DWORKLOAD_SANITIZE=OFF
cmake --build build/host
ctest --test-dir build/host --output-on-failure
'''
scope = "always"
fast = ["product", "host-tests"]

# --- host-ON -------------------------------------------------------------------------------------

[[check]]
id = "host-tests-sanitize-on"
job = "host-ON"
run = '''
cmake -S tests/host -B build/host -G Ninja -DWORKLOAD_SANITIZE=ON
cmake --build build/host
ctest --test-dir build/host --output-on-failure
'''
scope = "always"
fast = ["product", "host-tests"]

# --- workload ------------------------------------------------------------------------------------

[[check]]
id = "workload-native-sim"
job = "workload"
run = '''
cd ..
export ZEPHYR_BASE="$PWD/zephyr"
west twister -p native_sim/native/64 -T crux-controller/tests/native_sim \
  --inline-logs --clobber-output -O twister-out
'''
scope = "always"
fast = ["product", "scenarios"]

[[check]]
id = "workload-build"
job = "workload"
run = '''
cd ..
export ZEPHYR_BASE="$PWD/zephyr"
west build -p always -b "$BOARD" -d crux-controller/build/workload \
  crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
  -DEXTRA_CONF_FILE=conf/workload.conf
'''
scope = "always"
fast = ["product"]

[[check]]
id = "workload-outputs"
job = "workload"
run = '''
cd ..
for output in zephyr.bin zephyr.meta; do
  test -f "crux-controller/build/workload/zephyr/$output" || {
    echo "missing $output" >&2
    exit 1
  }
done
'''
scope = "always"
fast = ["product"]

[[check]]
id = "workload-config"
job = "workload"
run = '''
cd ..
build=crux-controller/build/workload/zephyr
for option in CONFIG_CRUX_CONTROLLER_WORKLOAD=y CONFIG_CRUX_LOGGING=y \
    CONFIG_CRUX_CONTROLLER_WORKER_STACK=4096; do
  grep -qx "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
done
# The product does not call the Crux Thread provider, so no configuration selects it.
for option in CONFIG_CRUX_THREAD=y; do
  ! grep -qx "$option" "$build/.config" || { echo "unexpected $option" >&2; exit 1; }
done
grep -q 'zephyr,log-uart' "$build/zephyr.dts" || { echo "no log UART selection" >&2; exit 1; }
! grep -qx 'CONFIG_CRUX_CONTROLLER_NET=y' "$build/.config"
'''
scope = "always"
fast = ["product"]

# --- net -----------------------------------------------------------------------------------------

[[check]]
id = "net-build"
job = "net"
run = '''
cd ..
export ZEPHYR_BASE="$PWD/zephyr"
west build -p always -b "$BOARD" -d crux-controller/build/net \
  crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
  "-DEXTRA_CONF_FILE=conf/workload.conf;conf/net.conf" \
  "-DEXTRA_DTC_OVERLAY_FILE=boards/net.overlay"
'''
scope = "always"

[[check]]
id = "net-outputs"
job = "net"
run = '''
cd ..
for output in zephyr.bin zephyr.meta; do
  test -f "crux-controller/build/net/zephyr/$output" || {
    echo "missing $output" >&2
    exit 1
  }
done
echo "Built net for $BOARD. No flash, reset or hardware command was run."
'''
scope = "always"

[[check]]
id = "net-config"
job = "net"
run = '''
cd ..
build=crux-controller/build/net/zephyr
# A fragment or overlay that is silently not applied would still build, so check
# what the build resolved, not what the command line asked for.
for option in CONFIG_CRUX_CONTROLLER_NET=y CONFIG_CRUX_SOCKETS=y CONFIG_CRUX_NETIF=y \
    'CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.77.2"' CONFIG_NET_CONFIG_SETTINGS=y; do
  grep -qxF "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
done
grep -Eq 'local-mac-address = \[ *02 *43 *52 *55 *58 *20 *\]' "$build/zephyr.dts" || {
  echo "the net overlay did not set the MAC address" >&2
  grep -n 'mac' "$build/zephyr.dts" | head -20 >&2 || true
  grep -rn 'net.overlay' crux-controller/build/net/CMakeCache.txt | head -5 >&2 || true
  exit 1
}
! grep -q 'green_led' "$build/zephyr.dts" || {
  echo "the net overlay did not delete green_led" >&2
  exit 1
}
'''
scope = "always"

# --- file ----------------------------------------------------------------------------------------

[[check]]
id = "file-build"
job = "file"
run = '''
cd ..
export ZEPHYR_BASE="$PWD/zephyr"
west build -p always -b "$BOARD" -d crux-controller/build/file \
  crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
  "-DEXTRA_CONF_FILE=conf/workload.conf;conf/file.conf" \
  "-DEXTRA_DTC_OVERLAY_FILE=boards/file.overlay"
'''
scope = "always"

[[check]]
id = "file-outputs"
job = "file"
run = '''
cd ..
for output in zephyr.bin zephyr.meta; do
  test -f "crux-controller/build/file/zephyr/$output" || {
    echo "missing $output" >&2
    exit 1
  }
done
echo "Built file for $BOARD. No flash, reset or hardware command was run."
'''
scope = "always"

[[check]]
id = "file-config"
job = "file"
run = '''
cd ..
build=crux-controller/build/file/zephyr
# An unmet Kconfig dependency only warns and a missing overlay entry would still
# build, so check what the build resolved, not what the command line asked for.
for option in CONFIG_CRUX_CONTROLLER_FILE=y CONFIG_CRUX_FILE_FATFS_RT1060=y \
    CONFIG_FILE_SYSTEM=y CONFIG_FAT_FILESYSTEM_ELM=y CONFIG_DISK_DRIVER_SDMMC=y; do
  grep -qxF "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
done
# No auto-format, no formatting service, no other storage.
for option in CONFIG_FS_FATFS_MOUNT_MKFS=y CONFIG_FILE_SYSTEM_MKFS=y \
    CONFIG_CRUX_FS_RELIANCE_EDGE=y CONFIG_CRUX_FILE_RELIANCE_EDGE=y; do
  ! grep -qxF "$option" "$build/.config" || { echo "unexpected $option" >&2; exit 1; }
done
grep -q 'controller_storage' "$build/zephyr.dts" || {
  echo "the file overlay did not add the fstab entry" >&2
  exit 1
}
grep -q 'zephyr,fstab,fatfs' "$build/zephyr.dts" || {
  echo "the fstab entry is not a FatFs entry" >&2
  exit 1
}
'''
scope = "always"

[[check]]
id = "file-symbols"
job = "file"
run = '''
cd ..
nm=$(find "$ZEPHYR_SDK_INSTALL_DIR" -name 'arm-zephyr-eabi-nm' -type f | head -n 1)
test -n "$nm" || { echo "no nm in the SDK" >&2; exit 1; }
"$nm" crux-controller/build/file/zephyr/zephyr.elf > symbols.txt
# The composition and the binding are linked. The formatting functions are not.
for symbol in storage_port_mount storage_port_bind crux_file_zephyr_bind \
    config_store_save config_store_load fs_mount; do
  grep -qE " [Tt] ${symbol}$" symbols.txt || { echo "not linked: $symbol" >&2; exit 1; }
done
for symbol in f_mkfs fs_mkfs; do
  ! grep -qE " [Tt] ${symbol}$" symbols.txt || { echo "linked: $symbol" >&2; exit 1; }
done
'''
scope = "always"

# --- system --------------------------------------------------------------------------------------

[[check]]
id = "system-build"
job = "system"
run = '''
cd ..
export ZEPHYR_BASE="$PWD/zephyr"
west build -p always -b "$BOARD" -d crux-controller/build/system \
  crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
  "-DEXTRA_CONF_FILE=conf/workload.conf;conf/system.conf" \
  "-DEXTRA_DTC_OVERLAY_FILE=boards/system.overlay"
'''
scope = "always"

[[check]]
id = "system-outputs"
job = "system"
run = '''
cd ..
for output in zephyr.bin zephyr.meta; do
  test -f "crux-controller/build/system/zephyr/$output" || {
    echo "missing $output" >&2
    exit 1
  }
done
echo "Built system for $BOARD. No flash, reset or hardware command was run."
'''
scope = "always"

[[check]]
id = "system-config"
job = "system"
run = '''
cd ..
build=crux-controller/build/system/zephyr
# An unmet Kconfig dependency only warns and a missing overlay entry would not stop
# the build before the provider checks it, so check what the build resolved, not what
# the command line asked for.
for option in CONFIG_CRUX_CONTROLLER_SYSTEM=y CONFIG_CRUX_SYSTEM=y CONFIG_WATCHDOG=y \
    CONFIG_HWINFO=y CONFIG_REBOOT=y; do
  grep -qxF "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
done
# Crux System refuses another owner of the watchdog or of the reset cause, and the
# product selects no Crux Thread or Sync provider.
for option in CONFIG_TASK_WDT=y CONFIG_TASK_WDT_HW_FALLBACK=y CONFIG_WDT_SHELL=y \
    CONFIG_HWINFO_SHELL=y CONFIG_CRUX_CONTROLLER_M3=y CONFIG_CRUX_THREAD=y \
    CONFIG_CRUX_SYNC=y; do
  ! grep -qxF "$option" "$build/.config" || { echo "unexpected $option" >&2; exit 1; }
done
grep -Eq 'crux-watchdog0 = &?wdog0' "$build/zephyr.dts" || {
  echo "the system overlay did not set the crux-watchdog0 alias" >&2
  grep -n 'crux-watchdog0' "$build/zephyr.dts" >&2 || true
  exit 1
}
awk '/wdog0: /,/};/' "$build/zephyr.dts" | grep -q 'status = "okay"' || {
  echo "the WDOG1 node (wdog0) is not enabled in the devicetree" >&2
  awk '/wdog0: /,/};/' "$build/zephyr.dts" >&2 || true
  exit 1
}
'''

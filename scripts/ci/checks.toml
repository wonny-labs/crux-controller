# --- patch-style ---------------------------------------------------------------------------------
# Zephyr's checkpatch.pl (rule BRACES) on the C lines that the change adds, as the style kit of
# crux-pilot does for a product repository (scripts/check-patch.sh is its copy). Zephyr is not a
# project of this manifest: it comes through the crux-pilot import, and west refuses to update
# it by name. The first check lets west update crux-pilot, reads the Zephyr commit that the Crux
# manifest names, and fetches only that commit. The second check runs the script with that
# checkout on the lines changed since the commit that scripts/ci/run-tier.sh compared the change
# with (scripts/ci/check-patch-range.sh).

[[check]]
id = "patch-style-fetch-zephyr"
job = "patch-style"
run = '''
set -euo pipefail
cd ..
workspace="$PWD"
west init -l crux-controller
west update crux-pilot
# The Crux import of Zephyr may not resolve until a full update has run. Then the plain
# update of the other jobs is the fallback: heavier, and known to work here.
if ! rev=$(west list -f '{revision}' zephyr 2>/dev/null); then
  echo "west cannot resolve zephyr yet; running a plain west update" >&2
  west update
  rev=$(west list -f '{revision}' zephyr)
fi
path=$(west list -f '{abspath}' zephyr)
if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
  echo "The Zephyr revision is not a full commit hash: $rev" >&2
  exit 1
fi
if [[ "$path" != "$workspace/zephyr" ]]; then
  echo "Zephyr is at $path, not in $workspace/zephyr" >&2
  exit 1
fi
if [[ ! -f "$path/scripts/checkpatch.pl" ]]; then
  git init -q "$path"
  git -C "$path" fetch --no-tags --depth=1 https://github.com/zephyrproject-rtos/zephyr "$rev"
  git -C "$path" checkout -q FETCH_HEAD
fi
test -f "$path/scripts/checkpatch.pl"
'''
scope = "always"
fast = ["product", "management", "host-tests", "scenarios"]


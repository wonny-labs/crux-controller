# --- boundary ------------------------------------------------------------------------------------
# scripts/ci/prepare-job.sh fetches crux-pilot at the pinned commit. The job env of the workflow
# (or, without it, scripts/include-check-pins.json) gives CHECK_COMMIT, CHECK_SHA256, KIT_COMMIT,
# CHECKER_SHA256 and WRAPPER_SHA256.

[[check]]
id = "boundary-check"
job = "boundary"
run = '''
cd ..
python crux-controller/scripts/check_boundary.py --repo crux-controller --crux-root crux-pilot
'''
scope = "always"
fast = ["product", "management"]

# The crux-pilot revision pinned in west.yml contains the same script with the same hash.
# This check downloads it from an immutable commit and checks it against that hash; the Dev
# container job checks and runs the pinned copy, and a test compares the two hashes.
[[check]]
id = "product-include-check"
job = "boundary"
run = '''
set -euo pipefail
script="$(mktemp -d)/check_domain_includes.py"
curl --fail --silent --show-error --location --retry 3 --output "$script" \
  "https://raw.githubusercontent.com/wonny-labs/crux-pilot/${CHECK_COMMIT}/templates/product/check_domain_includes.py"
echo "${CHECK_SHA256}  ${script}" | sha256sum --check --strict -
python3 "$script" --product .
'''
scope = "always"
fast = ["product", "management"]

# The style kit of crux-pilot (templates/product/style) wraps the same checker. This check
# runs the kit's own wrapper, so that a change of the wrapper or of the layout it expects
# shows up here. Both files come from an immutable commit and are checked against their
# hashes, laid out as in crux-pilot: the wrapper in style/, the checker beside that folder.
[[check]]
id = "kit-include-check"
job = "boundary"
run = '''
set -euo pipefail
kit="$(mktemp -d)/style-kit"
mkdir -p "$kit/style"
base="https://raw.githubusercontent.com/wonny-labs/crux-pilot/${KIT_COMMIT}/templates/product"
curl --fail --silent --show-error --location --retry 3 \
  --output "$kit/check_domain_includes.py" "$base/check_domain_includes.py"
curl --fail --silent --show-error --location --retry 3 \
  --output "$kit/style/check-includes.sh" "$base/style/check-includes.sh"
echo "${CHECKER_SHA256}  $kit/check_domain_includes.py" | sha256sum --check --strict -
echo "${WRAPPER_SHA256}  $kit/style/check-includes.sh" | sha256sum --check --strict -
bash "$kit/style/check-includes.sh"
'''
scope = "always"
fast = ["product", "management"]


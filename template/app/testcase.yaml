# SPDX-License-Identifier: Apache-2.0
# The product's first test, a starting point for its own: Twister builds the application for
# native_sim, runs it and passes when the log shows the init and start entries of the descriptor,
# in that order (Twister's console harness). Run it from the workspace folder:
#   west twister -T product/app -p native_sim/native/64
common:
  platform_allow:
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "product: init"
      - "product: start"
tests:
  product.application.start:
    tags:
      - product

# The product on native_sim, for development and CI only. Zephyr merges this file with prj.conf for
# every native_sim target (native_sim and native_sim/native/64).
#
# - The entropy is the simulator's test source, so a key made here protects nothing; the framework
#   refuses a test source on any other board.
# - native_sim has no watchdog behind the alias crux-watchdog0, so the watchdog is not armed. The
#   start without a watchdog of decision D14 lets this build start the application; a product build
#   never sets it.
# - The network is Zephyr's loopback interface, with no host network: web management listens on
#   127.0.0.1 inside the process, and no SNTP server answers there.
# - Crux File uses the simulator's provider on a RAM disk, so nothing persists.
# - Crux Logging writes to the first PTY UART, which is the program's standard output.
CONFIG_CRUX_CONTROLLER_START_WITHOUT_WATCHDOG=y
CONFIG_CRUX_CONTROLLER_TIME_SERVER="127.0.0.1"
CONFIG_CRUX_WEB_BIND_ADDRESS="127.0.0.1"
CONFIG_CRUX_FILE_FATFS_SIMULATOR=y
# The web adapter refuses the external libc of native_sim.
CONFIG_PICOLIBC=y
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Crux Serial accepts only an emulated UART on native_sim, so the console owns one (the overlay).
CONFIG_EMUL=y
CONFIG_UART_EMUL=y

CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=256
CONFIG_NET_BUF_TX_COUNT=256

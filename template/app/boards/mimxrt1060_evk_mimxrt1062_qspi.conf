# The product on the reference board, the RT1060-EVKB (board target mimxrt1060_evk@B/mimxrt1062/qspi).
# Zephyr merges this file with prj.conf for that target. The values are those of the framework's
# base image on this board (app/conf/base.conf of crux-controller at the commit that the copy was
# made from); none was measured for a product.
#
# - Health supervision arms the Crux System watchdog and keeps the boot counter and the last-fault
#   record in the retained region of the overlay, without mutexes, because the fatal error handler
#   writes it.
# - Stack hardening of a product build (requirement S6): compiler stack canaries and the MPU stack
#   guard of the Cortex-M7.
# - The network is the board's Ethernet port with a static address, configured before main(). The
#   framework's SNTP server is its default, 192.168.77.1.
# - Crux File is a FAT volume on a RAM disk in the SDRAM, so nothing persists across a reset. The
#   entropy is the i.MX RT random source (TRNG), which the framework requires on a board.
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
CONFIG_RETENTION=y
CONFIG_RETENTION_MUTEX_FORCE_DISABLE=y
CONFIG_STACK_CANARIES=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_CRUX_SOCKETS=y
CONFIG_GPIO=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.77.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW=""
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_NETWORKING=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_POSIX_FD_MGMT=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_MONOTONIC_CLOCK=y
CONFIG_PHY_MONITOR_PERIOD=500
CONFIG_CRUX_WEB_BIND_ADDRESS="192.168.77.2"
CONFIG_NET_TCP_ISN_RFC6528=y
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=5840
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=5840
CONFIG_NET_BUF_RX_COUNT=1024
CONFIG_NET_BUF_TX_COUNT=768
CONFIG_NET_PKT_RX_COUNT=192
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_ETH_NXP_ENET_RX_BUFFERS=6

CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_IMX_USDHC=n
CONFIG_CRUX_FILE_FATFS_RT1060_RAM_DISK=y

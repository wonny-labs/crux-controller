common:
  platform_allow:
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  tags:
    - controller
    - framework
tests:
  controller.framework.native_sim.tls_refused:
    timeout: 300
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "tls scenario start"
        - "phase storage access ok"
        - "application init result=0 channels=2 state=initialised"
        - "tls certificate start refused result=-[0-9]+: web management stays off"
        - "phase web management failed result=-[0-9]+"
        - "serial command line started on crux-serial0"
        - "phase command line ok"
        - "start prerequisites healthy: configuration=healthy"
        - "application started state=running"
        - "startup supervision ended in step 12 application state=running"
        - "tls scenario: the wrapped start ran once"
        - "tls scenario: configuration, status and command line healthy, web failed"
        - "tls scenario: the reboot thread runs"
        - "tls scenario: no listener on port 443"
        - "tls scenario: controller operational, application running"
        - "tls scenario: the console made the first account"
        - "tls scenario: the status command shows web failed and the others healthy"
        - "tls scenario done"

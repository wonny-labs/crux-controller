# The scenario of the controller framework with no watchdog (criterion 7, second part): health
# supervision only, without web management, the command line or time synchronisation, on Crux
# System with no watchdog behind the alias crux-watchdog0 and no simulated watchdog, with the
# option of decision D14 that allows operation without a watchdog. A restart goes through
# crux_system_reset(), which CONFIG_NATIVE_SIM_REBOOT turns into a restart of the simulated process.
CONFIG_CRUX_CONTROLLER_FRAMEWORK=y
CONFIG_CRUX_CONTROLLER_START_WITHOUT_WATCHDOG=y
CONFIG_CRUX_CONTROLLER_FRAMEWORK_FAULT_INJECTION=y
CONFIG_CRUX_CONTROLLER_SUPERVISOR_PERIOD_MS=500
CONFIG_CRUX_CONTROLLER_WATCHDOG_TIMEOUT_MS=2000
CONFIG_CRUX_CONTROLLER_DEADLINE_APPLICATION_MS=2000
CONFIG_CRUX_CONTROLLER_STABLE_PERIOD_S=3600
CONFIG_MAIN_THREAD_PRIORITY=8

CONFIG_CRUX_SYSTEM=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_NATIVE_SIM_REBOOT=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=n
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_MUTEXES=n
CONFIG_RETENTION=y
CONFIG_RETENTION_MUTEXES=n

# Crux Logging writes to an emulated UART, which the program copies to standard output.
CONFIG_CRUX_TIME=y
CONFIG_CRUX_LOGGING=y
CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PICOLIBC=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=n
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
CONFIG_LOG_BACKEND_UART_ASYNC=n
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BACKEND_SHOW_LEVEL=y
CONFIG_LOG_BACKEND_CRLF_NONE=n
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SHELL=n

common:
  platform_allow:
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  tags:
    - controller
    - framework
tests:
  controller.framework.native_sim.no_watchdog:
    timeout: 300
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "no watchdog scenario boot 1"
        - "boot class=power counter=0 threshold=3 safe mode=no retained region"
        - "watchdog not armed"
        - "fault injection: step application stalls"
        - "no watchdog scenario boot 2"
        - "reset cause=0x004 supported=0x005 captured, flags cleared"
        - "boot class=fault counter=1 threshold=3 safe mode=no retained region"
        - "last fault deadline application"
        - "controller state=operational"
        - "no watchdog scenario done"

# A fragment for the build test of criterion 32 (check base-settings-file-sources): Crux's Settings
# File provider of Configuration on the LittleFS volume of the storage scenario. The check configures
# the scenario with it and reads which Settings File sources the build compiles; nothing runs it,
# because the framework cannot initialise the provider through a public Crux interface at the pin.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings/cfg"
CONFIG_CRUX_CONFIGURATION_SETTINGS_FILE_ANY_FS=y

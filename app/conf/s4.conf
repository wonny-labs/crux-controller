# Step S4: the reset cause and a single-owner watchdog, through Crux System.
#
# Built on S1 (conf/s1.conf), without the network of S2 or the file of S3. Crux System asks the
# image for three native facilities and refuses to build without them (components/system in
# crux-pilot, at the pinned revision): the watchdog, HWINFO for the reset cause, and reboot. The
# watchdog itself is chosen by the devicetree alias crux-watchdog0 that boards/s4.overlay sets
# to the RT1060's WDOG1; the provider checks that node. It also refuses an image in which another
# owner of the watchdog or of the reset cause is on, so none of those is set here: the watchdog
# and HWINFO shells, the task watchdog and its hardware fallback. The product selects no Crux
# Thread, Sync or Queue provider, and no Crux symbol other than CRUX_SYSTEM.
CONFIG_CRUX_CONTROLLER_S4=y
CONFIG_CRUX_SYSTEM=y

CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

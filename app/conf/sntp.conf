# The sntp capability: the realtime clock of Crux Time, set from an SNTP server.
#
# Built on the network that net configures (conf/workload.conf;conf/net.conf;conf/sntp.conf with boards/net.overlay): the
# static address, the loopback-free Ethernet configuration, UDP and the socket options are net's.
# The Zephyr SNTP library is the one new facility. The product sets no Crux symbol for it: Crux
# Time is on for every configuration (conf/workload.conf), the realtime part of it needs no option, and there is
# no RTC. The server, the interval and the limits are product options with defaults in app/Kconfig
# (CRUX_CONTROLLER_TIME_*), which this fragment leaves at those defaults.
CONFIG_CRUX_CONTROLLER_SNTP=y
CONFIG_SNTP=y

# One UDP socket more than the net image uses, while the TCP exchange may hold others: a starting value for
# the network contexts, not measured.
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MAX_CONN=6

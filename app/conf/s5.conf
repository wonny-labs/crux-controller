# Step S5: the realtime clock of Crux Time, set from an SNTP server.
#
# Built on the network of S2 (conf/s1.conf;conf/s2.conf;conf/s5.conf with boards/s2.overlay): the
# static address, the loopback-free Ethernet configuration, UDP and the socket options are S2's.
# The Zephyr SNTP library is the one new facility. The product sets no Crux symbol for it: Crux
# Time is on for every step (conf/s1.conf), the realtime part of it needs no option, and there is
# no RTC. The server, the interval and the limits are product options with defaults in app/Kconfig
# (CRUX_CONTROLLER_TIME_*), which this fragment leaves at those defaults.
CONFIG_CRUX_CONTROLLER_S5=y
CONFIG_SNTP=y

# One UDP socket more than S2 uses, while the TCP exchange may hold others: a starting value for
# the network contexts, not measured.
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MAX_CONN=6

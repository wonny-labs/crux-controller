# Step S2: the workload's messages also go to a TCP peer over Ethernet.
#
# The network lines follow the reference controller's configuration in crux-pilot
# (m3-network.conf at the pinned revision), as a product-owned copy. Differences from it:
#   dropped: CRUX_M3_NETWORK_PROBE (a sample option), the shell and every shell option,
#            NET_BUF_POOL_USAGE, PRINTK_SYNC, and MAIN_STACK_SIZE (S1 sets it);
#   changed: NET_CONFIG_SETTINGS is on, with NET_CONFIG_AUTO_INIT, NET_CONFIG_NEED_IPV4 and a
#            static IPv4 address, so that no application code touches the network stack
#            (the reference assigns the address in sample C code);
#   added:   the CRUX_CONTROLLER_S2, CRUX_SOCKETS and CRUX_NETIF options, the POSIX options
#            that the Sockets profile requires, and the worker stack sizes at the end.
# The reference composition also applies the MDIO completion correction. This image does not.
# The board is 192.168.77.2/24 and the peer 192.168.77.1, the point-to-point addressing that
# crux-pilot's networking evidence uses.
CONFIG_CRUX_CONTROLLER_S2=y
CONFIG_CRUX_SOCKETS=y
CONFIG_CRUX_NETIF=y

CONFIG_GPIO=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.77.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW=""

# What the Sockets profile requires of the image.
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_NETWORKING=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_POSIX_FD_MGMT=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_MONOTONIC_CLOCK=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_MAX_CONN=4
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_PHY_MONITOR_PERIOD=500

# The exchange runs on the consumer thread and reaches into the network stack.
CONFIG_CRUX_THREAD_STACK_BYTES=8192
CONFIG_CRUX_CONTROLLER_WORKER_STACK=8192

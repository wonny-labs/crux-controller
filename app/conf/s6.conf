# Step S6: management of the device over HTTPS, on the Mbed TLS profile of Crux.
#
# Built on the network of S2 (conf/s1.conf;conf/s2.conf;conf/s6.conf with
# boards/s2.overlay;boards/s6.overlay): the static address 192.168.77.2/24 is S2's, and this
# fragment overrides the S2 values that are too small for TLS. A later fragment wins. S6 is not
# built with S3 (another file provider) or S4 (it clears the reset cause that S6 reads once). S5 is
# allowed and is not built in CI.
#
# The lines follow the RT1060-EVK Rev B management image that Crux documents for its Mbed TLS
# profile (samples/boards/nxp/mimxrt1060_evk/web_management and the profile files it names, at the pinned
# revision),
# as a product-owned copy. Whether that sample has been cross-built was not checked at the pinned revision, so nothing here is a result.
# Differences from it: the first account is not made here (a later step makes it from the serial
# console), only the services that S6 routes are built (no reboot, network settings or file
# service, and so no SSH, command line or Settings File), and the web lifecycle is started through
# the public headers.
#
# The Crux services select their own Thread and Sync symbols and the Time symbol, so none of them
# is named here or anywhere else in this product. Every size and priority below is a starting
# value that was not measured on a board; the findings note says which.
CONFIG_CRUX_CONTROLLER_S6=y

# The Mbed TLS profile: Mbed TLS behind Zephyr's TLS sockets, on TF-PSA-Crypto. TLS 1.2 is compiled
# in with 1.3, and the web adapter asks the socket for 1.3 and one cipher suite.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=120000
# A client can send a whole 16 KiB record unless the server has negotiated less.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_128_GCM_SHA256=y
# What the TLS stack, Access and the credential store ask of PSA Crypto.
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
# The two lines that the Crux sample for this board has beyond the profile files.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_MBEDTLS_PK_WRITE_C=y
# The locks of the core of TF-PSA-Crypto, which Access, the credential store and the TLS threads
# share. Experimental in Crux, and the module sets the user configuration file itself.
CONFIG_CRUX_PSA_THREADING=y

# The Crux services. The module selects Thread, Sync and Time for them.
CONFIG_CRUX_ACCESS=y
CONFIG_CRUX_CONFIG_SERVICE=y
CONFIG_CRUX_MGMT_STATUS=y
CONFIG_CRUX_TLS_CERTIFICATE=y
CONFIG_CRUX_WEB=y
CONFIG_CRUX_WEB_SESSION=y
CONFIG_CRUX_WEB_MANAGEMENT=y
# The status service reads Crux System, which needs the three native facilities and the watchdog
# alias of boards/s6.overlay. The image never arms the watchdog.
CONFIG_CRUX_SYSTEM=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# The listener: HTTPS on the one address of the board. The text must equal the static address of
# conf/s2.conf, and the start refuses an address that is not a dotted IPv4 text.
CONFIG_CRUX_WEB_PORT=443
CONFIG_CRUX_WEB_BIND_ADDRESS="192.168.77.2"
CONFIG_CRUX_WEB_BACKLOG=4
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
# The server thread runs each TLS handshake inside accept. Its stack on this board is not measured.
CONFIG_HTTP_SERVER_STACK_SIZE=16384
# Priorities of the Crux workers, above the log thread (14) and the time synchronisation thread
# (10), below the workload (5). The HTTP server's own thread runs at the lowest preemptive
# priority, and Crux has no setting for it.
CONFIG_CRUX_WEB_SESSION_WORKER_PRIORITY=11
CONFIG_CRUX_WEB_MANAGEMENT_WORKER_PRIORITY=11
CONFIG_CRUX_SECURITY_EVENT_DRAIN_PRIORITY=11

# Entropy: the i.MX RT TRNG through its driver, and no test generator or fake source. The Crux
# fail-closed correction for its glue is applied in app/management/entropy.cmake.
CONFIG_ENTROPY_GENERATOR=y

# The file backend: FatFs over a RAM disk (boards/s6.overlay), and no card driver in the image.
# Zephyr turns the SD card driver on when the board's devicetree has the card, so it is turned off.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=127
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_NUM_FILES=6
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_IMX_USDHC=n
CONFIG_CRUX_FILE_FATFS_RT1060_RAM_DISK=y

# The TLS socket layer and the credentials that the web adapter reads.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6
CONFIG_NET_TCP_ISN_RFC6528=y
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_ZVFS_POLL_MAX=24
CONFIG_ZVFS_EVENTFD=y
# S2's numbers are far too small for three TLS connections beside the workload exchange.
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
# Network buffers as the RT1060-EVKB bench image of Crux sizes them (paper rules, not measured).
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=5840
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=5840
CONFIG_NET_BUF_RX_COUNT=1024
CONFIG_NET_BUF_TX_COUNT=768
CONFIG_NET_PKT_RX_COUNT=192
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_ETH_NXP_ENET_RX_BUFFERS=6

# The Zephyr kernel heap, which the HTTP server and the file system use.
CONFIG_HEAP_MEM_POOL_SIZE=32768
# The main thread runs key generation, signing and the format of the RAM disk at start, and S1's
# 4096 bytes are far too small for that. Not measured.
CONFIG_MAIN_STACK_SIZE=16384
# So that a later board run can read the stack use of each thread.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

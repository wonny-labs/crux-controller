# Step S3: the workload's configuration record is kept in a file on the microSD volume.
#
# Built on S1 (conf/s1.conf), without the network of S2. The lines follow the microSD composition
# that crux-pilot documents for its FatFs provider (samples/storage_sd/prj.conf at the pinned
# revision), as a product-owned copy. Differences from it: CONFIG_CRUX_PILOT_MODULE is not
# repeated (the application's prj.conf keeps it on), and the mount comes from a devicetree
# fstab entry (boards/s3.overlay) instead of C code that declares the file system object.
# The image has no formatting service (CONFIG_FILE_SYSTEM_MKFS stays off) and no auto-format
# (CONFIG_FS_FATFS_MOUNT_MKFS=n, which the provider also requires). Nothing is stored on any
# other medium and no secure management group is enabled.
CONFIG_CRUX_CONTROLLER_S3=y
CONFIG_CRUX_FILE_FATFS_RT1060=y

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=127
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_IMX_USDHC=y

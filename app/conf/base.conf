# The base image: the controller framework with no application, on the RT1060-EVKB.
#
# Built as app/prj.conf with this fragment and the overlays boards/net.overlay (the Ethernet
# composition) and boards/management.overlay (the RAM disk and the watchdog alias that Crux System
# needs). The values are those of the configurations workload, net, management and sntp, without
# their own options and without the workload: the logging of workload, the network of net, the
# Mbed TLS profile, the services and the RAM disk of management, and the SNTP library of sntp, plus
# the Crux serial console. The framework's services are on by default when their Crux and Zephyr
# symbols are on (zephyr/Kconfig), so this fragment turns on only the framework and what the
# services need.
#
# The medium is a RAM disk, so nothing persists across a reset: the first account made on the
# serial command line is gone after a reset. The board-specific lines (the RT1060 RAM disk
# provider, the TRNG entropy source, the Ethernet buffers) are here and not in a board file yet;
# the console's UART is the alias crux-serial0 of the board file. Health supervision arms the Crux
# System watchdog and keeps the boot counter in the retained region of boards/retained.overlay;
# there is no application. Every size, priority and timeout is a starting value that was not
# measured on a board.
CONFIG_CRUX_CONTROLLER_FRAMEWORK=y

# Health supervision (specification sections 4 and 5): the task watchdog without a hardware
# fallback, which Crux System refuses, the retention area of the boot counter and the last-fault
# record without mutexes, because the fatal error handler writes it (the *_MUTEX_FORCE_DISABLE
# options, which Zephyr documents for access from an ISR), and Crux Reboot, whose worker
# the framework replaces with its own reboot thread. The thread that runs the start function is in
# the startup band (8), below the supervisor (7) (section 7.4).
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=n
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
CONFIG_RETENTION=y
CONFIG_RETENTION_MUTEX_FORCE_DISABLE=y
CONFIG_CRUX_REBOOT=y
CONFIG_MAIN_THREAD_PRIORITY=8

# Stack hardening of a product build (requirement S6): compiler stack canaries and the MPU stack
# guard of the Cortex-M7.
CONFIG_STACK_CANARIES=y
CONFIG_HW_STACK_PROTECTION=y


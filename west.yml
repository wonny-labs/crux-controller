# West manifest of crux-controller. This repository is the manifest repository
# and Crux (crux-pilot) is imported at a pinned commit (west's T2 topology). No optional
# group is enabled in Stage 1. The Crux import is narrowed by name (see the comment on the
# project). The one other project is picolibc, a test-only libc for the native_sim scenario of
# step S2 (see the comment on the project).
manifest:
  version: "1.2"

  remotes:
    - name: crux
      url-base: https://github.com/wonny-labs
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: crux-pilot
      remote: crux
      # Commit of crux-pilot origin/main of 23 November 2026. It follows 1c4cf284 (Crux's samples in
      # purpose folders, the controller sample removed from Crux, one board-ready Dev Container with
      # scripts/bootstrap.sh, the Settings File selection that does not depend on Reliance Edge, the
      # pin bot), renames the samples time/clock_shell to time/shell and file/write_read to file/basic,
      # and lets the Dev Container image build download the pinned J-Link package when none is given
      # (CI and automated image builds pass CRUX_JLINK=0). The Crux manifest, the public headers and
      # the Zephyr module name (crux) are as before. The earlier revision's File composition
      # interface <crux/file_zephyr.h>, the public management headers, the simulated native_sim System
      # watchdog, the web header deadline (CONFIG_CRUX_WEB_HEADER_DEADLINE_MS, default 10000) and the
      # move of the crypto modules to the revisions of Zephyr's v4.4-branch stay in it: Mbed TLS 4.1.1
      # plus 8 commits and TF-PSA-Crypto 1.1.1 plus 24 commits, as the dependency review of crux-pilot
      # counts them. Both are in the optional group crux-secure-management, which stays off here. No
      # Crux tag exists yet, so this is a commit, not a tag.
      revision: c5439c51741bceb8f3327c11882dc3b58bbe2640
      # The Crux manifest puts Mbed TLS and TF-PSA-Crypto in the same optional group
      # (crux-secure-management) as wolfSSL, wolfSSH and wolfPSA, which are GPL or commercial.
      # Blocking the three wolf projects by name keeps them out of the resolved manifest, so
      # enabling that group would activate the Mbed modules and no GPL stack (checked at the
      # project-list level; only the S6 build job and the Budget row of S6 switch the group on, in
      # their own runner, and they run that check first). The group itself stays off here.
      # scripts/check_mbed_only.py checks this, and the West pins job runs it.
      import:
        name-blocklist:
          - wolfssl
          - wolfssh
          - wolfpsa

    # Test-only. The native_sim scenario of S2 needs an embedded libc, because the native
    # libc of native_sim would bypass Zephyr's socket providers, and Crux's manifest does not
    # import this module. The revision is the one in Zephyr's own manifest at the Zephyr
    # release that Crux pins, so west crux-pins reports it as OK. SDK builds of the target
    # use the toolchain's Picolibc, not this module.
    - name: picolibc
      remote: zephyrproject-rtos
      revision: 01254932e8e81085817ed61fd858648584ffe37c
      path: modules/lib/picolibc

  self:
    path: crux-controller

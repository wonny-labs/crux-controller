name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Tooling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests/tooling -v

  pins:
    name: West pins
    runs-on: ubuntu-24.04
    steps:
      # The manifest repository sits in a workspace directory, one level
      # below the west workspace root, as in the product template.
      - uses: actions/checkout@v4
        with:
          path: crux-controller
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install west==1.4.0
      - name: Fetch the workspace
        run: |
          west init -l crux-controller
          west update
      - name: Contract check
        run: |
          set -o pipefail
          west crux-pins | tee pins.txt
          grep -q '^CONTRACT crux-pilot ' pins.txt
          if grep -q '^MISMATCH' pins.txt; then
            echo "unexpected MISMATCH" >&2
            exit 1
          fi
      - name: Negative control, a pin without a reason must fail
        run: |
          # A newer revision of littlefs than the one Crux pins, with no
          # crux-override. It contains the pinned commit, so west crux-pins
          # reports MISMATCH rather than an error. This edit stays in the
          # runner's working copy.
          python - <<'PY'
          import yaml

          path = "crux-controller/west.yml"
          data = yaml.safe_load(open(path))
          manifest = data["manifest"]
          if not any(remote["name"] == "zephyrproject-rtos" for remote in manifest["remotes"]):
              manifest["remotes"].append(
                  {"name": "zephyrproject-rtos", "url-base": "https://github.com/zephyrproject-rtos"}
              )
          manifest["projects"].append(
              {
                  "name": "littlefs",
                  "remote": "zephyrproject-rtos",
                  "revision": "e9a8638fc228e43a3156ed3ac602229af3e3c1d5",
                  "path": "modules/fs/littlefs",
              }
          )
          yaml.safe_dump(data, open(path, "w"), sort_keys=False)
          PY
          west update littlefs
          set +e
          west crux-pins > pins-negative.txt 2>&1
          status=$?
          set -e
          cat pins-negative.txt
          test "$status" -ne 0
          grep -q '^MISMATCH littlefs .* (contract ' pins-negative.txt

  host:
    name: Host tests (sanitize ${{ matrix.sanitize }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the workload tests
        run: |
          cmake -S tests/host -B build/host -G Ninja -DWORKLOAD_SANITIZE=${{ matrix.sanitize }}
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure

  s1:
    name: S1 (native_sim and RT1060-EVKB)
    runs-on: ubuntu-24.04
    env:
      BOARD: mimxrt1060_evk@B//qspi
      SDK_VERSION: "1.0.1"
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/sdk/zephyr-sdk-1.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib ca-certificates device-tree-compiler file gperf git \
            libmagic1 libsdl2-dev pkg-config python3-dev wget xz-utils
      - name: Install pinned build tools
        run: python -m pip install cmake==3.28.4 ninja==1.11.1 west==1.4.0
      - name: Fetch the workspace
        run: |
          west init -l crux-controller
          west update
          python -m pip install -r zephyr/scripts/requirements-base.txt \
            -r zephyr/scripts/requirements-build-test.txt \
            -r zephyr/scripts/requirements-run-test.txt
      - name: Restore the Zephyr SDK
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: zephyr-sdk-${{ env.SDK_VERSION }}-arm-zephyr-eabi
      - name: Install the Zephyr SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        working-directory: zephyr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          west sdk install --version "$SDK_VERSION" --install-base "$GITHUB_WORKSPACE/sdk" \
            --gnu-toolchains arm-zephyr-eabi --personal-access-token "$GH_TOKEN"
      - name: Run the S1 scenario on native_sim
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          west twister -p native_sim/native/64 -T crux-controller/tests/native_sim \
            --inline-logs --clobber-output -O twister-out
      - name: Cross-build S1 with the baseline gate required
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          west build -p always -b '${{ env.BOARD }}' -d crux-controller/build/s1 \
            crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
            -DEXTRA_CONF_FILE=conf/s1.conf
      - name: Check the outputs exist
        run: |
          for output in zephyr.bin zephyr.meta; do
            test -f "crux-controller/build/s1/zephyr/$output" || {
              echo "missing $output" >&2
              exit 1
            }
          done
      - name: Check the resolved S1 configuration
        run: |
          build=crux-controller/build/s1/zephyr
          for option in CONFIG_CRUX_THREAD=y CONFIG_CRUX_QUEUE=y CONFIG_CRUX_LOGGING=y; do
            grep -qx "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
          done
          grep -q 'zephyr,log-uart' "$build/zephyr.dts" || { echo "no log UART selection" >&2; exit 1; }
          ! grep -qx 'CONFIG_CRUX_CONTROLLER_S2=y' "$build/.config"

  s2:
    name: S2 build (RT1060-EVKB, networking)
    runs-on: ubuntu-24.04
    env:
      BOARD: mimxrt1060_evk@B//qspi
      SDK_VERSION: "1.0.1"
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/sdk/zephyr-sdk-1.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates device-tree-compiler file gperf git \
            libmagic1 pkg-config wget xz-utils
      - name: Install pinned build tools
        run: python -m pip install cmake==3.28.4 ninja==1.11.1 west==1.4.0
      - name: Fetch the workspace
        run: |
          west init -l crux-controller
          west update
          python -m pip install -r zephyr/scripts/requirements-base.txt
      - name: Restore the Zephyr SDK
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: zephyr-sdk-${{ env.SDK_VERSION }}-arm-zephyr-eabi
      - name: Install the Zephyr SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        working-directory: zephyr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          west sdk install --version "$SDK_VERSION" --install-base "$GITHUB_WORKSPACE/sdk" \
            --gnu-toolchains arm-zephyr-eabi --personal-access-token "$GH_TOKEN"
      - name: Cross-build S2 with the baseline gate required
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          west build -p always -b '${{ env.BOARD }}' -d crux-controller/build/s2 \
            crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
            "-DEXTRA_CONF_FILE=conf/s1.conf;conf/s2.conf" \
            "-DEXTRA_DTC_OVERLAY_FILE=boards/s2.overlay"
      - name: Check the outputs exist
        run: |
          for output in zephyr.bin zephyr.meta; do
            test -f "crux-controller/build/s2/zephyr/$output" || {
              echo "missing $output" >&2
              exit 1
            }
          done
          echo "Built S2 for $BOARD. No flash, reset or hardware command was run."
      - name: Check the resolved S2 configuration and devicetree
        run: |
          build=crux-controller/build/s2/zephyr
          # A fragment or overlay that is silently not applied would still build, so check
          # what the build resolved, not what the command line asked for.
          for option in CONFIG_CRUX_CONTROLLER_S2=y CONFIG_CRUX_SOCKETS=y CONFIG_CRUX_NETIF=y \
              'CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.77.2"' CONFIG_NET_CONFIG_SETTINGS=y; do
            grep -qxF "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
          done
          grep -Eq 'local-mac-address = \[ *02 *43 *52 *55 *58 *20 *\]' "$build/zephyr.dts" || {
            echo "the S2 overlay did not set the MAC address" >&2
            grep -n 'mac' "$build/zephyr.dts" | head -20 >&2 || true
            grep -rn 's2.overlay' crux-controller/build/s2/CMakeCache.txt | head -5 >&2 || true
            exit 1
          }
          ! grep -q 'green_led' "$build/zephyr.dts" || {
            echo "the S2 overlay did not delete green_led" >&2
            exit 1
          }

  s3:
    name: S3 build (RT1060-EVKB, File)
    runs-on: ubuntu-24.04
    env:
      BOARD: mimxrt1060_evk@B//qspi
      SDK_VERSION: "1.0.1"
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/sdk/zephyr-sdk-1.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates device-tree-compiler file gperf git \
            libmagic1 pkg-config wget xz-utils
      - name: Install pinned build tools
        run: python -m pip install cmake==3.28.4 ninja==1.11.1 west==1.4.0
      - name: Fetch the workspace
        run: |
          west init -l crux-controller
          west update
          python -m pip install -r zephyr/scripts/requirements-base.txt
      - name: Restore the Zephyr SDK
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: zephyr-sdk-${{ env.SDK_VERSION }}-arm-zephyr-eabi
      - name: Install the Zephyr SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        working-directory: zephyr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          west sdk install --version "$SDK_VERSION" --install-base "$GITHUB_WORKSPACE/sdk" \
            --gnu-toolchains arm-zephyr-eabi --personal-access-token "$GH_TOKEN"
      - name: Cross-build S3 with the baseline gate required
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          west build -p always -b '${{ env.BOARD }}' -d crux-controller/build/s3 \
            crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
            "-DEXTRA_CONF_FILE=conf/s1.conf;conf/s3.conf" \
            "-DEXTRA_DTC_OVERLAY_FILE=boards/s3.overlay"
      - name: Check the outputs exist
        run: |
          for output in zephyr.bin zephyr.meta; do
            test -f "crux-controller/build/s3/zephyr/$output" || {
              echo "missing $output" >&2
              exit 1
            }
          done
          echo "Built S3 for $BOARD. No flash, reset or hardware command was run."
      - name: Check the resolved S3 configuration and devicetree
        run: |
          build=crux-controller/build/s3/zephyr
          # An unmet Kconfig dependency only warns and a missing overlay entry would still
          # build, so check what the build resolved, not what the command line asked for.
          for option in CONFIG_CRUX_CONTROLLER_S3=y CONFIG_CRUX_FILE_FATFS_RT1060=y \
              CONFIG_FILE_SYSTEM=y CONFIG_FAT_FILESYSTEM_ELM=y CONFIG_DISK_DRIVER_SDMMC=y; do
            grep -qxF "$option" "$build/.config" || { echo "missing $option" >&2; exit 1; }
          done
          # No auto-format, no formatting service, no other storage.
          for option in CONFIG_FS_FATFS_MOUNT_MKFS=y CONFIG_FILE_SYSTEM_MKFS=y \
              CONFIG_CRUX_FS_RELIANCE_EDGE=y CONFIG_CRUX_FILE_RELIANCE_EDGE=y; do
            ! grep -qxF "$option" "$build/.config" || { echo "unexpected $option" >&2; exit 1; }
          done
          grep -q 'controller_storage' "$build/zephyr.dts" || {
            echo "the S3 overlay did not add the fstab entry" >&2
            exit 1
          }
          grep -q 'zephyr,fstab,fatfs' "$build/zephyr.dts" || {
            echo "the fstab entry is not a FatFs entry" >&2
            exit 1
          }
      - name: Check what the image links
        run: |
          nm=$(find "$ZEPHYR_SDK_INSTALL_DIR" -name 'arm-zephyr-eabi-nm' -type f | head -n 1)
          test -n "$nm" || { echo "no nm in the SDK" >&2; exit 1; }
          "$nm" crux-controller/build/s3/zephyr/zephyr.elf > symbols.txt
          # The composition and the binding are linked. The formatting functions are not.
          for symbol in storage_port_mount storage_port_bind crux_file_zephyr_bind \
              config_store_save config_store_load fs_mount; do
            grep -qE " [Tt] ${symbol}$" symbols.txt || { echo "not linked: $symbol" >&2; exit 1; }
          done
          for symbol in f_mkfs fs_mkfs; do
            ! grep -qE " [Tt] ${symbol}$" symbols.txt || { echo "linked: $symbol" >&2; exit 1; }
          done

  boundary:
    name: Boundary check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install west==1.4.0
      - name: Fetch crux-pilot at the pinned commit
        run: |
          west init -l crux-controller
          west update crux-pilot
      - name: Check the includes of app/src, app/compose and workload
        run: python crux-controller/scripts/check_boundary.py --repo crux-controller --crux-root crux-pilot
      # The crux-pilot revision pinned in west.yml predates this script, so it is downloaded
      # from an immutable commit and checked against its hash. Moving the pin makes the
      # download unnecessary.
      - name: Run the Crux Pilot product include check
        env:
          CHECK_COMMIT: a72032b2f29c8c4579de8de07a43b40f19bb9516
          CHECK_SHA256: eb297a527da071ed2e863fd456ec80a46c77b446f2544cf984f7a4775b94bf80
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/check_domain_includes.py"
          curl --fail --silent --show-error --location --retry 3 --output "$script" \
            "https://raw.githubusercontent.com/wonny-labs/crux-pilot/${CHECK_COMMIT}/templates/product/check_domain_includes.py"
          echo "${CHECK_SHA256}  ${script}" | sha256sum --check --strict -
          cd crux-controller
          python3 "$script" --product .

  s0:
    name: S0 build (RT1060-EVKB)
    runs-on: ubuntu-24.04
    env:
      BOARD: mimxrt1060_evk@B//qspi
      SDK_VERSION: "1.0.1"
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/sdk/zephyr-sdk-1.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates device-tree-compiler file gperf git \
            libmagic1 pkg-config wget xz-utils
      - name: Install pinned build tools
        run: python -m pip install cmake==3.28.4 ninja==1.11.1 west==1.4.0
      - name: Fetch the workspace
        run: |
          west init -l crux-controller
          west update
          python -m pip install -r zephyr/scripts/requirements-base.txt
      - name: Restore the Zephyr SDK
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: zephyr-sdk-${{ env.SDK_VERSION }}-arm-zephyr-eabi
      - name: Install the Zephyr SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        working-directory: zephyr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          west sdk install --version "$SDK_VERSION" --install-base "$GITHUB_WORKSPACE/sdk" \
            --gnu-toolchains arm-zephyr-eabi --personal-access-token "$GH_TOKEN"
      - name: Cross-build with the Zephyr baseline gate required
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: |
          west build -p always -b '${{ env.BOARD }}' -d crux-controller/build/app \
            crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON
      - name: Check the outputs exist
        run: |
          for output in zephyr.bin zephyr.meta; do
            test -f "crux-controller/build/app/zephyr/$output" || {
              echo "missing $output" >&2
              exit 1
            }
          done
          echo "Built for $BOARD. No flash, reset or hardware command was run."

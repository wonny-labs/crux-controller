  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The versions are pinned: another clang-format or clang-tidy may report differently.
      # scripts/check-format.sh and scripts/analyze_host.py also check the version they run.
      - name: Install the pinned tools
        run: |
          python -m pip install clang-format==18.1.8
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18=1:18.1.3-1ubuntu1
      - name: Check format
        run: ./scripts/check-format.sh
      # Configures tests/host for its compile database and analyses every source in it with the
      # checks of .clang-tidy. The sources that are not in the database (the ones that need Zephyr)
      # are listed at the end of the output. Any finding fails the job.
      - name: Analyze the host-built sources
        run: python scripts/analyze_host.py

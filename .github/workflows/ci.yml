name: ci

# A thin wrapper: scripts/ci/run-tier.sh picks and runs the checks of the tier from
# scripts/ci/checks.toml, where each job of this workflow has the job of the same name
# (CONTRIBUTING.md, CI tiers). The steps here only set up the runner.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (CONTRIBUTING.md, CI tiers)"
        type: choice
        options: [full, fast, nightly]
        default: full

# Supersede only older runs of the same pull request. Runs on main and manual runs are unique.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tooling:
    name: Tooling tests
    runs-on: ubuntu-24.04
    env:
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan the checks of this tier
        id: plan
        working-directory: crux-controller
        run: |
          scripts/ci/run-tier.sh "$TIER" --job tooling --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job tooling --count)" >> "$GITHUB_OUTPUT"
      - name: Install PyYAML
        if: steps.plan.outputs.checks != '0'
        run: python -m pip install pyyaml
      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-controller
        run: scripts/ci/run-tier.sh "$TIER" --job tooling

  pins:
    name: West pins
    runs-on: ubuntu-24.04
    env:
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan the checks of this tier
        id: plan
        working-directory: crux-controller
        run: |
          scripts/ci/run-tier.sh "$TIER" --job pins --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job pins --count)" >> "$GITHUB_OUTPUT"
      - name: Install pinned build tools
        if: steps.plan.outputs.checks != '0'
        run: python -m pip install west==1.4.0
      - name: Prepare the workspace
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-controller
        run: scripts/ci/prepare-job.sh pins
      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-controller
        run: scripts/ci/run-tier.sh "$TIER" --job pins

  host:
    name: Host tests (sanitize ${{ matrix.sanitize }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["OFF", "ON"]
    env:
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
          fetch-depth: 0
      - name: Plan the checks of this tier
        id: plan
        working-directory: crux-controller
        run: |
          scripts/ci/run-tier.sh "$TIER" --job "host-${{ matrix.sanitize }}" --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job "host-${{ matrix.sanitize }}" --count)" >> "$GITHUB_OUTPUT"
      # clang-18 with libFuzzer (libclang-rt-18-dev) serves the nightly check host-fuzz, pinned at
      # the version of clang-tidy-18 in the static job.
      - name: Install host packages
        if: steps.plan.outputs.checks != '0'
        run: |
          crux-controller/scripts/ci/apt-install.sh --no-install-recommends \
            clang-18=1:18.1.3-1ubuntu1 libclang-rt-18-dev=1:18.1.3-1ubuntu1
      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-controller
        run: scripts/ci/run-tier.sh "$TIER" --job "host-${{ matrix.sanitize }}"


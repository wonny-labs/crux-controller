name: release

# A dry run of the release flow. It builds in a fresh workspace from a frozen
# manifest, assembles the bundle and checks it. It publishes nothing: it
# creates no tag or GitHub Release and uploads no artefact. Publishing waits
# for the owner's approval of a tag.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "release/**"
      - "west.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Release dry run (publishes nothing)
    runs-on: ubuntu-24.04
    env:
      BOARD: mimxrt1060_evk@B//qspi
      SDK_VERSION: "1.0.1"
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/sdk/zephyr-sdk-1.0.1
      PRODUCT_VERSION: "0.1.0+1"
      SECURITY_COUNTER: "0"
      RELEASE_TAG: v0.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
      - name: Choose the fresh workspace path
        run: echo "FRESH=$RUNNER_TEMP/release-workspace" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates device-tree-compiler file gperf git \
            libmagic1 pkg-config wget xz-utils
      - name: Install pinned build tools
        run: python -m pip install cmake==3.28.4 ninja==1.11.1 west==1.4.0 pyyaml
      - name: Tests of the release tools
        run: |
          python -m unittest discover -s crux-controller/tests/tooling -p 'test_bundle.py' -v
          python -m unittest discover -s crux-controller/tests/tooling -p 'test_spdx.py' -v
      - name: Fetch the workspace and check the pins
        run: |
          west init -l crux-controller
          west update
          set -o pipefail
          west crux-pins | tee pins-report.txt
          grep -q '^CONTRACT crux-pilot ' pins-report.txt
          if grep -q '^MISMATCH' pins-report.txt; then
            echo "unexpected MISMATCH" >&2
            exit 1
          fi
      - name: Freeze the manifest
        run: west manifest --freeze --active-only > west.frozen.yml
      - name: Fresh workspace from the lock
        run: |
          # Outside the first workspace: west refuses a workspace inside another.
          mkdir -p "$FRESH"
          cp -a crux-controller "$FRESH/crux-controller"
          # Keep .git: the build record hashes the tracked source with git.
          rm -rf "$FRESH/crux-controller/build"
          mkdir -p "$FRESH/crux-controller/locks"
          cp west.frozen.yml "$FRESH/crux-controller/locks/west.frozen.yml"
          cd "$FRESH"
          west init -l crux-controller --mf locks/west.frozen.yml
          west update
          python -m pip install -r zephyr/scripts/requirements-base.txt
          west crux-pins
      - name: Restore the Zephyr SDK
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: zephyr-sdk-${{ env.SDK_VERSION }}-arm-zephyr-eabi
      - name: Install the Zephyr SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.FRESH }}/zephyr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          west sdk install --version "$SDK_VERSION" --install-base "$GITHUB_WORKSPACE/sdk" \
            --gnu-toolchains arm-zephyr-eabi --personal-access-token "$GH_TOKEN"
      - name: Build the S2 image with the baseline gate required
        working-directory: ${{ env.FRESH }}
        env:
          ZEPHYR_BASE: ${{ env.FRESH }}/zephyr
        run: |
          python crux-pilot/scripts/record-build-provenance.py --repo crux-controller \
            --workspace . --capture-inputs crux-controller/build/inputs.json
          west spdx --init -d crux-controller/build/s2
          west build -p always -b "$BOARD" -d crux-controller/build/s2 \
            crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
            "-DEXTRA_CONF_FILE=conf/s1.conf;conf/s2.conf" \
            "-DEXTRA_DTC_OVERLAY_FILE=boards/s2.overlay"
          west build -d crux-controller/build/s2 -t rom_report
          west build -d crux-controller/build/s2 -t ram_report
          python crux-pilot/scripts/record-build-provenance.py --repo crux-controller \
            --workspace . --build-dir crux-controller/build/s2 --target "$BOARD" \
            --inputs crux-controller/build/inputs.json
          west spdx -d crux-controller/build/s2
      - name: Parse the west spdx output
        run: |
          # Answers whether the SPDX files that west spdx wrote parse as tag-value
          # SPDX 2.3 and have the document header fields. Prints the package count of
          # each document. Reads the files in place: nothing is copied or uploaded.
          set -o pipefail
          python crux-controller/release/parse_spdx.py --dir "$FRESH/crux-controller/build/s2/spdx" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Assemble the bundle
        run: |
          python crux-controller/release/assemble_bundle.py \
            --build-dir "$FRESH/crux-controller/build/s2" \
            --lock west.frozen.yml --pins-report pins-report.txt \
            --out-dir bundle \
            --product-version "$PRODUCT_VERSION" --security-counter "$SECURITY_COUNTER" \
            --release-tag "$RELEASE_TAG" --sdk-version "$SDK_VERSION" \
            --runner-image ubuntu-24.04 --target "$BOARD"
      - name: Check the bundle
        run: python crux-controller/release/check_bundle.py bundle
      - name: Print the release manifest
        run: cat bundle/release-manifest.json
      - name: Scan the SBOM files, informational
        run: |
          # The full SBOM is not in the bundle yet. The scan shows whether it
          # could go out as it is, which decides the later steps. The private
          # string list is the owner's and is not available here.
          rm -rf extended
          cp -r bundle extended
          mkdir extended/spdx
          cp "$FRESH/crux-controller/build/s2/spdx/"*.spdx extended/spdx/ 2>/dev/null || true
          cp "$FRESH/crux-controller/build/s2/provenance.json" extended/ 2>/dev/null || true
          ls extended/spdx | head
          python crux-controller/release/check_bundle.py extended 2>&1 | grep 'absolute path' | head -20 || true
      - name: What this run did not do
        run: |
          echo "No tag, no GitHub Release, no uploaded artefact, no flash or hardware command."

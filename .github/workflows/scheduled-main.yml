name: scheduled-main

# A daily build against the current main of crux-pilot, information only: scripts/ci/run-tier.sh
# runs the nightly job scheduled-main of scripts/ci/checks.toml (CONTRIBUTING.md, CI tiers). The
# pinned build in ci.yml stays the gate for pull requests. It commits nothing, publishes nothing and
# uploads no artefact.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (CONTRIBUTING.md, CI tiers); the job runs only in nightly"
        type: choice
        options: [nightly, full, fast]
        default: nightly

concurrency:
  group: scheduled-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: net build against crux-pilot main
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule' || github.repository == 'wonny-labs/crux-controller'
    timeout-minutes: 60
    env:
      SDK_VERSION: "1.0.1"
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/sdk/zephyr-sdk-1.0.1
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan the checks of this tier
        id: plan
        working-directory: crux-controller
        run: |
          scripts/ci/run-tier.sh "$TIER" --job scheduled-main --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job scheduled-main --count)" >> "$GITHUB_OUTPUT"
      - name: Install host packages
        if: steps.plan.outputs.checks != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates device-tree-compiler file gperf git \
            libmagic1 pkg-config wget xz-utils
      - name: Install pinned build tools
        if: steps.plan.outputs.checks != '0'
        run: python -m pip install cmake==3.28.4 ninja==1.11.1 west==1.4.0 pyyaml
      - name: Restore the Zephyr SDK
        if: steps.plan.outputs.checks != '0'
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: zephyr-sdk-${{ env.SDK_VERSION }}-arm-zephyr-eabi
      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/run-tier.sh "$TIER" --job scheduled-main
      - name: Write the result summary
        if: always()
        run: |
          {
            echo "### Result"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "The net build against crux-pilot main passed with the gate required."
            elif [ "${{ job.status }}" = "cancelled" ]; then
              echo "The job was cancelled before it finished. It says nothing about crux-pilot main."
            else
              echo "The job failed. Open the failing step in the log. A fetch or pin failure"
              echo "means Crux main changed something this product has to follow. A build failure"
              echo "means the contract or the composition interface changed."
            fi
            echo
            echo "Published nothing, uploaded no artefact."
          } >> "$GITHUB_STEP_SUMMARY"

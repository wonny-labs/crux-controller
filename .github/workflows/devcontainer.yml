name: devcontainer

# A thin wrapper: scripts/ci/run-tier.sh runs the job devcontainer of scripts/ci/checks.toml, which
# builds the dev container image from .devcontainer/Dockerfile and runs checks inside it through
# scripts/dev-shell.sh (CONTRIBUTING.md, CI tiers). west.yml is a trigger because a move of the pin
# changes the Zephyr requirement files that setup.sh installs, and main is a trigger so that such a
# change cannot break the container unseen. scripts/ci/ holds the checks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".devcontainer/**"
      - "scripts/dev-shell.sh"
      - "scripts/bootstrap.sh"
      - ".vscode/**"
      - "west.yml"
      - ".github/workflows/devcontainer.yml"
      - "scripts/ci/**"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "scripts/dev-shell.sh"
      - "scripts/bootstrap.sh"
      - ".vscode/**"
      - "west.yml"
      - ".github/workflows/devcontainer.yml"
      - "scripts/ci/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (CONTRIBUTING.md, CI tiers)"
        type: choice
        options: [full, fast, nightly]
        default: full

# Supersede only older runs of the same pull request. Runs on main and manual runs are unique.
concurrency:
  group: devcontainer-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  devcontainer:
    name: Dev container (tooling tests, boundary check, workload native_sim and RT1060-EVKB)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
          fetch-depth: 0
      - name: Plan the checks of this tier
        id: plan
        working-directory: crux-controller
        run: |
          scripts/ci/run-tier.sh "$TIER" --job devcontainer --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job devcontainer --count)" >> "$GITHUB_OUTPUT"
      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-controller
        run: scripts/ci/run-tier.sh "$TIER" --job devcontainer

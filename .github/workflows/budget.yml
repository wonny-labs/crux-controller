name: budget

# A thin wrapper: each row runs the job budget-<config> of scripts/ci/checks.toml through
# scripts/ci/run-tier.sh. scripts/ci/budget.sh builds the configuration with the Zephyr baseline gate
# required and checks its static resource use against budgets/limits.json. It prints the numbers to
# the log and to the job summary. No image, ELF or map file is uploaded, because the repository
# publishes hashes only (CONTRIBUTING.md, CI tiers).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to run (CONTRIBUTING.md, CI tiers)"
        type: choice
        options: [full, fast, nightly]
        default: full

# Supersede only older runs of the same pull request. Runs on main and manual runs are unique.
concurrency:
  group: budget-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  budget:
    name: Budget ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [minimal, workload, net, file, system, sntp, management, base]
    env:
      SDK_VERSION: "1.0.1"
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/sdk/zephyr-sdk-1.0.1
      TIER: ${{ inputs.tier || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-controller
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan the checks of this tier
        id: plan
        working-directory: crux-controller
        run: |
          scripts/ci/run-tier.sh "$TIER" --job "budget-${{ matrix.config }}" --plan
          echo "checks=$(scripts/ci/run-tier.sh "$TIER" --job "budget-${{ matrix.config }}" --count)" >> "$GITHUB_OUTPUT"
      - name: Install host packages
        if: steps.plan.outputs.checks != '0'
        run: |
          crux-controller/scripts/ci/apt-install.sh --no-install-recommends \
            build-essential ca-certificates device-tree-compiler file gperf git \
            libmagic1 pkg-config wget xz-utils
      - name: Install pinned build tools
        if: steps.plan.outputs.checks != '0'
        run: python -m pip install cmake==3.28.4 ninja==1.11.1 west==1.4.0
      - name: Restore the Zephyr SDK
        if: steps.plan.outputs.checks != '0'
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: zephyr-sdk-${{ env.SDK_VERSION }}-arm-zephyr-eabi
      - name: Prepare the workspace
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/prepare-job.sh "budget-${{ matrix.config }}"
      - name: Run the checks of this tier
        if: steps.plan.outputs.checks != '0'
        working-directory: crux-controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/run-tier.sh "$TIER" --job "budget-${{ matrix.config }}"

name: rebuild

# Builds the S2 image twice, in two fresh workspaces at different paths, and
# compares zephyr.bin and firmware_identity. A difference fails the job. It
# publishes nothing and uploads no artefact. When a release record exists,
# the second build can be compared with that record instead (see
# release/rebuild_compare.py).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/rebuild.yml"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild at another path and compare
    runs-on: ubuntu-24.04
    env:
      BOARD: mimxrt1060_evk@B//qspi
      SDK_VERSION: "1.0.1"
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/sdk/zephyr-sdk-1.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates device-tree-compiler file gperf git \
            libmagic1 pkg-config wget xz-utils
      - name: Install pinned build tools
        run: python -m pip install cmake==3.28.4 ninja==1.11.1 west==1.4.0
      - name: Restore the Zephyr SDK
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: sdk
          key: zephyr-sdk-${{ env.SDK_VERSION }}-arm-zephyr-eabi
      - name: Install the Zephyr SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          west init -l .
          west update zephyr
          cd ../zephyr
          west sdk install --version "$SDK_VERSION" --install-base "$GITHUB_WORKSPACE/sdk" \
            --gnu-toolchains arm-zephyr-eabi --personal-access-token "$GH_TOKEN"
      - name: Build in the first workspace
        run: |
          mkdir -p first
          cp -a source first/crux-controller
          rm -rf first/crux-controller/.git first/crux-controller/.west
          cd first
          west init -l crux-controller
          west update
          python -m pip install -r zephyr/scripts/requirements-base.txt
          ZEPHYR_BASE="$PWD/zephyr" west build -p always -b "$BOARD" -d crux-controller/build/s2 \
            crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
            "-DEXTRA_CONF_FILE=conf/s1.conf;conf/s2.conf" \
            "-DEXTRA_DTC_OVERLAY_FILE=boards/s2.overlay"
      - name: Build in a second workspace at another path
        run: |
          mkdir -p second/another/depth
          cp -a source second/another/depth/crux-controller
          rm -rf second/another/depth/crux-controller/.git second/another/depth/crux-controller/.west
          cd second/another/depth
          west init -l crux-controller
          west update
          ZEPHYR_BASE="$PWD/zephyr" west build -p always -b "$BOARD" -d crux-controller/build/s2 \
            crux-controller/app -- -DCRUX_REQUIRE_VERIFIED_ZEPHYR=ON \
            "-DEXTRA_CONF_FILE=conf/s1.conf;conf/s2.conf" \
            "-DEXTRA_DTC_OVERLAY_FILE=boards/s2.overlay"
      - name: Record the first build and compare the second with it
        run: |
          printf 'manifest:\n  projects: []\n' > lock-placeholder.yml
          printf 'rebuild comparison\n' > pins-placeholder.txt
          python source/release/assemble_bundle.py \
            --build-dir first/crux-controller/build/s2 \
            --lock lock-placeholder.yml --pins-report pins-placeholder.txt \
            --out-dir record-bundle \
            --product-version 0.1.0+1 --security-counter 0 --release-tag v0.1.0 \
            --sdk-version "$SDK_VERSION" --runner-image ubuntu-24.04 --target "$BOARD"
          cat record-bundle/release-manifest.json
          python source/release/rebuild_compare.py \
            --record record-bundle/release-manifest.json \
            --build-dir second/another/depth/crux-controller/build/s2 --target "$BOARD"
      - name: What this run did not do
        run: echo "No tag, no GitHub Release, no uploaded artefact, no flash or hardware command."
